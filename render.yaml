databases:
  - name: andrea-jimenez-db
    databaseName: andrea_jimenez
    user: andrea_user
    plan: free
    ipAllowList:
      - source: 74.220.48.0/24
        description: Render Oregon Egress
      - source: 0.0.0.0/0
        description: Allow all

services:
  - type: web
    name: andrea-jimenez
    runtime: python
    plan: free
    autoDeployTrigger: commit
    autoDeploy: true
    buildCommand: "./build.sh"
    startCommand: "gunicorn Andrea_jimenez.wsgi:application --bind 0.0.0.0:10000"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: andrea-jimenez-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: Andrea_jimenez.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEPLOY_TRIGGER
        value: 11
      - key: EMAIL_HOST_USER
        value: andreajimenezctg@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: moza uqim zxyo xjbd
